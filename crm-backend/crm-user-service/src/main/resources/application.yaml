spring:
  datasource:
    url: jdbc:mysql://mysql5.sqlpub.com:3310/crm_system_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: crm_db
    password: XAa4j7dhveN4MSzi
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: CrmUserHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never  # 用户服务不需要初始化数据库，由provider服务负责

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

dubbo:
  application:
    name: crm-user-service
  registry:
    address: nacos://127.0.0.1:8848
  protocol:
    name: dubbo
    port: 20881
  consumer:
    timeout: 5000
  provider:
    timeout: 5000

logging:
  level:
    com.pk.crm: DEBUG
    org.mybatis: DEBUG